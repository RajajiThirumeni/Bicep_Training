name: Build and Deploy Application

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  RESOURCE_GROUP: rgdemo219
  ACR_NAME: acrdemo921
  IMAGE_NAME: reference-app-1
  CONTAINER_APP: academo921

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify Azure and ACR
        run: |
          echo "Azure account:"
          az account show --query "{name:name,id:id,tenantId:tenantId}" -o table

          echo "Checking ACR:"
          az acr show \
            --name "$ACR_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --query "{name:name,loginServer:loginServer,id:id}" \
            -o table

      - name: Set Multiple Revision Mode
        run: |
          az containerapp revision set-mode \
            --name "$CONTAINER_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --mode multiple

      - name: ACR Login
        run: |
          ACR_LOGIN_SERVER=$(az acr show \
            --name "$ACR_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --query loginServer \
            -o tsv)

          echo "ACR Login Server: $ACR_LOGIN_SERVER"
          echo "ACR_LOGIN_SERVER=$ACR_LOGIN_SERVER" >> "$GITHUB_ENV"

          az acr login --name "$ACR_NAME"

      - name: Build and Push SHA Image
        run: |
          IMAGE="$ACR_LOGIN_SERVER/$IMAGE_NAME:${GITHUB_SHA}"

          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

          echo "Building image:"
          echo "$IMAGE"

          docker build -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Get Previous Revision
        id: previous
        shell: bash
        run: |
          PREVIOUS=$(az containerapp revision list \
            --name "$CONTAINER_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --query "[?properties.trafficWeight==\`100\`].name | [0]" \
            -o tsv)

          echo "Previous revision: $PREVIOUS"
          echo "revision=$PREVIOUS" >> "$GITHUB_OUTPUT"

      - name: Deploy New Revision
        id: deploy
        shell: bash
        run: |
          az containerapp update \
            --name "$CONTAINER_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$IMAGE" \
            --revision-suffix "${GITHUB_SHA:0:12}-${GITHUB_RUN_NUMBER}"

          NEW_REVISION=$(az containerapp show \
            --name "$CONTAINER_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --query "properties.latestRevisionName" \
            -o tsv)

          echo "New revision: $NEW_REVISION"
          echo "revision=$NEW_REVISION" >> "$GITHUB_OUTPUT"

      - name: Keep Previous Revision Serving
        run: |
          NEW_REVISION="${{ steps.deploy.outputs.revision }}"
          PREVIOUS_REVISION="${{ steps.previous.outputs.revision }}"

          if [ -n "$PREVIOUS_REVISION" ]; then
            echo "Keeping previous revision at 100% traffic."

            az containerapp ingress traffic set \
              --name "$CONTAINER_APP" \
              --resource-group "$RESOURCE_GROUP" \
              --revision-weight \
                "$PREVIOUS_REVISION=100" \
                "$NEW_REVISION=0"
          else
            echo "No previous revision found."
          fi

      - name: Wait for Revision Health
        id: health
        shell: bash
        run: |
          REVISION="${{ steps.deploy.outputs.revision }}"

          echo "Waiting for revision health:"
          echo "$REVISION"

          for i in {1..30}; do
            STATE=$(az containerapp revision show \
              --name "$CONTAINER_APP" \
              --resource-group "$RESOURCE_GROUP" \
              --revision "$REVISION" \
              --query "{health:properties.healthState,running:properties.runningState,provisioning:properties.provisioningState,replicas:properties.replicas,error:properties.provisioningError}" \
              -o json)

            echo "Attempt $i:"
            echo "$STATE"

            HEALTH=$(echo "$STATE" | jq -r '.health')
            RUNNING=$(echo "$STATE" | jq -r '.running')
            PROVISIONING=$(echo "$STATE" | jq -r '.provisioning')

            if [ "$HEALTH" = "Healthy" ] && [ "$PROVISIONING" = "Provisioned" ]; then
              case "$RUNNING" in
                Running|RunningAtMaxScale)
                  echo "Revision is healthy and running."
                  exit 0
                  ;;
              esac
            fi

            if [ "$HEALTH" = "Unhealthy" ]; then
              echo "Revision health is Unhealthy."
              exit 1
            fi

            if [ "$RUNNING" = "Failed" ] || [ "$PROVISIONING" = "Failed" ]; then
              echo "Revision entered a failed state."
              exit 1
            fi

            sleep 10
          done

          echo "Revision did not become healthy within the timeout."
          exit 1

      - name: Promote New Revision
        if: success()
        run: |
          NEW_REVISION="${{ steps.deploy.outputs.revision }}"
          PREVIOUS_REVISION="${{ steps.previous.outputs.revision }}"

          echo "Promoting new revision:"
          echo "$NEW_REVISION"

          if [ -n "$PREVIOUS_REVISION" ]; then
            az containerapp ingress traffic set \
              --name "$CONTAINER_APP" \
              --resource-group "$RESOURCE_GROUP" \
              --revision-weight \
                "$PREVIOUS_REVISION=0" \
                "$NEW_REVISION=100"
          else
            az containerapp ingress traffic set \
              --name "$CONTAINER_APP" \
              --resource-group "$RESOURCE_GROUP" \
              --revision-weight \
                "$NEW_REVISION=100"
          fi

          echo "New revision now has 100% traffic."

      - name: Rollback
        if: failure() && steps.previous.outputs.revision != ''
        run: |
          PREVIOUS_REVISION="${{ steps.previous.outputs.revision }}"
          NEW_REVISION="${{ steps.deploy.outputs.revision }}"

          echo "Deployment failed."
          echo "Rolling back to:"
          echo "$PREVIOUS_REVISION"

          az containerapp ingress traffic set \
            --name "$CONTAINER_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --revision-weight \
              "$PREVIOUS_REVISION=100" \
              "$NEW_REVISION=0"

          echo "Rollback completed."

          exit 1